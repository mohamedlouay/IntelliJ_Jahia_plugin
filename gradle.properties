pluginGroup = fr.tolc.jahia.intellij.plugin
pluginName = CND Language / Jahia Framework
pluginRepositoryUrl = https://github.com/mohamedlouay/IntelliJ_Jahia_plugin
pluginVersion = 3.0.0

# 251 = IntelliJ IDEA 2025.1.
# untilBuild covers only the range actually checked by the Plugin Verifier below.
# Widen it only after verifying against the target version.
pluginSinceBuild = 251
pluginUntilBuild = 252.*

# Compile against the MINIMUM supported version, not the newest one.
# IU (Ultimate): the JavaEE/EL and JSP plugins do not exist in Community.
platformType = IU
platformVersion = 2025.1.1

platformBundledPlugins = com.intellij.java,com.intellij.properties,com.intellij.javaee.el,com.intellij.jsp

javaVersion = 21

org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching = true
kotlin.stdlib.default.dependency = false

# Dependency resolution hits several JetBrains CDN hosts. On a flaky resolver,
# concurrent lookups produce spurious UnknownHostException, and the JVM then
# negative-caches the failure for 10s, so retries keep failing. Disable the
# negative cache and keep resolution single-threaded.
org.gradle.parallel = false
systemProp.sun.net.inetaddr.negative.ttl = 0
