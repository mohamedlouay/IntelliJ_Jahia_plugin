name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Plugin Verifier keeps the IDEs it verifies against outside the Gradle cache.
      # Without this, every run re-downloads roughly a gigabyte.
      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-${{ runner.os }}-${{ hashFiles('gradle.properties') }}
          restore-keys: plugin-verifier-${{ runner.os }}-

      # Compiles, runs the tests, and instruments the GUI Designer forms.
      - name: Build
        run: ./gradlew build

      - name: Verify plugin configuration
        run: ./gradlew verifyPluginProjectConfiguration

      # Fails on COMPATIBILITY_PROBLEMS and INVALID_PLUGIN, per build.gradle.kts.
      - name: Run Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      # Uploaded even when the verifier failed -- that is precisely when the report is worth reading.
      - name: Upload Plugin Verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
          if-no-files-found: ignore
