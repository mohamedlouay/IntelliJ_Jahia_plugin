name: Probe 2026.2

# THROWAWAY. Deleted once #17 has its answer.
#
# Second attempt. The first looked in ~/.pluginVerifier/ides, which is where the
# standalone Plugin Verifier CLI keeps its IDEs -- but the IntelliJ Platform
# Gradle Plugin 2.x does not use the CLI's downloader. It resolves each IDE as
# an ordinary Gradle dependency (idea:ideaIU:<version>) and lets the artifact
# transform unpack it, so the installation ends up under
# ~/.gradle/caches/<gradle-version>/transforms/<hash>/transformed/ideaIU-*.
# ~/.pluginVerifier/ides stays empty. Verified on the local 2025.1.1 install.
#
# Reference, measured on IU-2025.1.1 where the class still exists:
#   plugins/javaee-jsp-base-impl/lib/javaee-jsp-base-impl.jar
#     com/intellij/jsp/javaee/web/el/impl/JspELResolveUtil.class
#     com/intellij/jsp/javaee/web/el/impl/JspELResolveUtil$VariableInfoData.class

on:
  push:
    branches: [feat/gradle-build-2025]

permissions:
  contents: read

jobs:
  probe:
    name: Where did com.intellij.jsp.javaee go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Which IDEs recommended() actually selects today. Cheap, and it pins down
      # whether a missing installation below means "not selected" or "selection
      # succeeded but the run stopped before getting there".
      - name: What recommended() selects
        run: |
          {
            echo "## recommended() resolves to"
            echo '```'
            ./gradlew printProductsReleases -PverifyRecommended --console=plain 2>&1 | grep '^IU-'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only here to make the IDEs be downloaded. Expected to fail on 2026.2 --
      # that failure is the subject of #17. The output is kept because the first
      # run of this probe unpacked only three of the five selected IDEs, which
      # means the task stops early for a reason nothing has printed yet.
      - name: Download the recommended IDEs
        continue-on-error: true
        run: ./gradlew verifyPlugin -PverifyRecommended --console=plain 2>&1 | tee verify.log

      - name: Why it stopped
        if: always()
        run: |
          {
            echo "## Tail of the verifyPlugin run"
            echo '```'
            tail -120 verify.log 2>/dev/null || echo "(no verify.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Search the 2026.2 jars
        if: always()
        run: |
          set -u
          transforms="$HOME/.gradle/caches"
          mapfile -t all < <(find "$transforms" -maxdepth 5 -type d -name 'ideaIU-*' 2>/dev/null | sort)
          ide=$(printf '%s\n' "${all[@]}" | grep -- '-2026\.2' | head -1)

          {
            echo "## Probe of IU-2026.2"
            echo
            echo "IDE installations unpacked by Gradle:"
            echo '```'
            printf '%s\n' "${all[@]}"
            echo '```'
            echo

            if [ -z "$ide" ]; then
              echo "_No 2026.2 installation among them._"
              exit 0
            fi
            echo "Searching \`$ide\`"
            echo

            search() {
              find "$ide" -name '*.jar' -print0 \
                | xargs -0 -r -n1 sh -c 'unzip -Z1 "$0" 2>/dev/null | grep -E "'"$1"'" | sed "s|^|$(basename $(dirname $(dirname $0)))/$(basename $0): |"' \
                | sort -u | head -40
            }

            echo "### Any class named *ELResolveUtil*"
            echo '```'
            search 'ELResolveUtil'
            echo '```'
            echo

            echo "### Any class named *VariableInfoData*"
            echo '```'
            search 'VariableInfoData'
            echo '```'
            echo

            echo "### The package com/intellij/jsp/javaee, in full"
            echo '```'
            search '^com/intellij/jsp/javaee/'
            echo '```'
            echo

            echo "### ElVariablesProvider and ELImplicitVariable (the public API we rely on)"
            echo '```'
            search 'javaee/el/providers/ElVariablesProvider|javaee/el/util/ELImplicitVariable'
            echo '```'
            echo

            echo "### Is the javaee-jsp-base-impl plugin still there at all"
            echo '```'
            ls -d "$ide"/plugins/*jsp* "$ide"/plugins/*javaee* 2>/dev/null || echo "(no jsp or javaee plugin directory)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
