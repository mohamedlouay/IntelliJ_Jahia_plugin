name: Probe 2026.2

# THROWAWAY. Deleted in the commit right after the one that adds it.
#
# #17 asks three questions about IU-262, where com.intellij.jsp.javaee has gone
# missing: does JspELResolveUtil still exist under another package, did
# VariableInfoData survive, and is the ElVariablesProvider extension point
# unchanged. Answering them needs the 2026.2 jars. Downloading that IDE locally
# failed twice at a ten-minute timeout -- but the compatibility runner already
# downloads it, so ask the question where the answer already is.
#
# push-triggered because workflow_dispatch shows no "Run workflow" button until
# the file reaches the default branch, and master is untouched by this migration.

on:
  push:
    branches: [feat/gradle-build-2025]

permissions:
  contents: read

jobs:
  probe:
    name: Where did com.intellij.jsp.javaee go
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Plugin Verifier IDEs
        uses: actions/cache@v4
        with:
          path: ~/.pluginVerifier/ides
          key: plugin-verifier-recommended-${{ runner.os }}-${{ github.run_id }}
          restore-keys: plugin-verifier-recommended-${{ runner.os }}-

      # Only here to make the verifier download the IDEs. It is expected to fail
      # on 2026.2 -- that failure is the subject of #17.
      - name: Download the recommended IDEs
        continue-on-error: true
        run: ./gradlew verifyPlugin -PverifyRecommended

      - name: Search the 2026.2 jars
        if: always()
        run: |
          set -u
          ide=$(find ~/.pluginVerifier/ides -maxdepth 1 -name 'IU-262*' -o -maxdepth 1 -name '*262.*' | head -1)
          {
            echo "## Probe of IU-262"
            echo
            if [ -z "$ide" ]; then
              echo '_2026.2 was not downloaded. IDEs present:_'
              echo '```'
              ls ~/.pluginVerifier/ides 2>/dev/null || echo "(no ides directory)"
              echo '```'
              exit 0
            fi
            echo "IDE: \`$ide\`"
            echo

            echo "### Any class named *ELResolveUtil*"
            echo '```'
            find "$ide" -name '*.jar' -print0 \
              | xargs -0 -I{} sh -c 'unzip -Z1 "{}" 2>/dev/null | grep -i "ELResolveUtil" | sed "s|^|$(basename {}): |"' \
              | sort -u | head -40
            echo '```'
            echo

            echo "### Any class named *VariableInfoData*"
            echo '```'
            find "$ide" -name '*.jar' -print0 \
              | xargs -0 -I{} sh -c 'unzip -Z1 "{}" 2>/dev/null | grep -i "VariableInfoData" | sed "s|^|$(basename {}): |"' \
              | sort -u | head -40
            echo '```'
            echo

            echo "### Does the package com/intellij/jsp/javaee exist at all"
            echo '```'
            find "$ide" -name '*.jar' -print0 \
              | xargs -0 -I{} sh -c 'unzip -Z1 "{}" 2>/dev/null | grep "^com/intellij/jsp/javaee/" | sed "s|^|$(basename {}): |"' \
              | sort -u | head -30
            echo '```'
            echo

            echo "### ElVariablesProvider and the extension point"
            echo '```'
            find "$ide" -name '*.jar' -print0 \
              | xargs -0 -I{} sh -c 'unzip -Z1 "{}" 2>/dev/null | grep -E "javaee/el/providers/ElVariablesProvider|el/util/ELImplicitVariable" | sed "s|^|$(basename {}): |"' \
              | sort -u | head -20
            echo '```'
            echo

            echo "### implicitVariablesProvider declarations in plugin.xml files"
            echo '```'
            find "$ide" -name '*.jar' -print0 \
              | xargs -0 -I{} sh -c 'unzip -p "{}" META-INF/plugin.xml 2>/dev/null | grep -o "implicitVariablesProvider[^>]*" | sed "s|^|$(basename {}): |"' \
              | sort -u | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
